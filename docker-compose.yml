services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobflow
      MYSQL_USER: jobflow
      MYSQL_PASSWORD: jobflow
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: jobflow-api
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://jobflow:jobflow@mysql:3306/jobflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run tools/init-local.ps1 before starting JobFlow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: jobflow-api
    build: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --uid=nobody --gid=nogroup
    environment:
      DATABASE_URL: mysql+pymysql://jobflow:jobflow@mysql:3306/jobflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run tools/init-local.ps1 before starting JobFlow}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: jobflow-api
    build: ./backend
    command: celery -A app.celery_app:celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: mysql+pymysql://jobflow:jobflow@mysql:3306/jobflow
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run tools/init-local.ps1 before starting JobFlow}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  redis_data:
  uploads_data:
