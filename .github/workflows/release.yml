name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.lock
      - shell: pwsh
        run: pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - shell: pwsh
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $releaseVersion = "${{ github.ref_name }}".TrimStart("v")
          ./tools/package-release.ps1 `
            -ApiImage "ghcr.io/${{ github.repository_owner }}/jobflow-api:${{ github.ref_name }}" `
            -Version $releaseVersion
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jobflow-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jobflow-web:${{ github.ref_name }}
