name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --constraint constraints.lock -e ".[dev]"
      - run: python ../tools/check-version.py
      - run: ruff check app tests migrations ../tools/check-version.py
      - run: pytest -q --cov=app --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check
      - run: npm test

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/JobFlow.Desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.lock
      - run: pip install --constraint ../../backend/constraints.lock -e "../../backend[dev]"
      - run: dotnet restore --configfile ../NuGet.Config
      - run: dotnet build --no-restore --configuration Release
      - name: Verify self-contained package
        shell: pwsh
        run: |
          ../../tools/package-release.ps1
          $archive = "../../artifacts/jobflow-desktop-win-x64.zip"
          if (-not (Test-Path -LiteralPath $archive)) { throw "Desktop archive was not created" }
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive)).Entries
          if ($entries.Name -notcontains "JobFlow.Desktop.exe") { throw "Desktop executable is missing" }
          if ($entries.FullName -notcontains "server\JobFlow.Server.exe") { throw "Embedded server is missing" }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "jobflow-desktop-ci"
          $server = Resolve-Path "bin/Release/net8.0-windows7.0/win-x64/publish/server/JobFlow.Server.exe"
          $process = Start-Process $server -PassThru
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8000/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $healthy = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw "Embedded server did not become healthy" }
          } finally {
            if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(5000) }
          }

  e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up -d --build
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
